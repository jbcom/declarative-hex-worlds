name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[skip actions]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create or update the release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.CI_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      # `contents: write` is required by the "Attach SBOM + tarball to release"
      # step: softprops/action-gh-release UPDATES an existing release, and the
      # workflow-level `contents: read` made that fail with "Resource not
      # accessible by integration" — after npm publish had already succeeded, so
      # the package shipped but its SBOM and tarball never reached the release.
      # Scoped to this job so the workflow default stays read-only.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.11.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # `playwright` is a devDependency of the workspace PACKAGES (the library +
        # examples), not the workspace root — a bare `pnpm exec playwright` from
        # root fails with ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL ("playwright" not
        # found). Run it through the package that owns it (same as ci.yml), which
        # is also the package whose browser-free coverage the verify step enforces.
        run: pnpm --filter declarative-hex-worlds exec playwright install --with-deps chromium

      - name: Bootstrap FREE models for browser coverage
        # `pnpm --filter <pkg> exec` runs from the PACKAGE dir, so `--out` is
        # relative to it — `--out models` lands at packages/declarative-hex-worlds/
        # models (where vitest.browser.free.config's HEX_WORLDS_ASSET_ROOT looks).
        # The old `--out packages/declarative-hex-worlds/models` DOUBLED the path
        # (…/packages/declarative-hex-worlds/packages/declarative-hex-worlds/models),
        # so the browser-coverage GLTF fetches 404'd and Verify failed before publish.
        run: pnpm --filter declarative-hex-worlds exec tsx src/cli/cli.ts bootstrap --source github --out models

      - name: Production audit (high+)
        # Final blocking security gate before any bytes ship. Per-PR uses
        # dependency-review-action for CVE intake; this is the last word
        # before publish.
        run: pnpm audit --prod --audit-level=high

      - name: Verify package
        # Full verify chain: lint, typecheck, full vitest suite (incl.
        # contract specs under tests/contract/), and the merged unit +
        # browser-free coverage threshold. Same gates CI ran per-PR; re-run
        # at release to catch any drift between PR-CI and release time.
        run: |
          pnpm lint
          pnpm typecheck
          pnpm coverage:all:enforce

      - name: Build package
        env:
          # tsup's DTS generation runs TypeScript in a worker thread; the
          # v1.0.2 release build OOM'd its default heap on the 7 GB runner
          # (ERR_WORKER_OUT_OF_MEMORY). Give Node explicit headroom.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build

      - name: Pack tarball for attestation
        # Pack BEFORE publishing so we can attest the exact bytes that ship.
        # Use `pnpm pack`, NOT `npm pack`: the package.json uses pnpm's `catalog:`
        # protocol (e.g. "zod": "catalog:"), which ONLY pnpm resolves to a concrete
        # spec on pack/publish. `npm pack` leaves `catalog:` verbatim, so the
        # published tarball's deps are uninstallable (ERR_PNPM_SPEC_NOT_SUPPORTED
        # "zod@catalog:") — that shipped in the broken 1.1.0. `pnpm pack --json`
        # emits { name, filename, ... }; capture the filename. Runs in the LIBRARY
        # package (the workspace root is private + not published).
        id: pack
        working-directory: packages/declarative-hex-worlds
        run: |
          PACK_JSON=$(pnpm pack --json)
          TARBALL=$(echo "$PACK_JSON" | node -e 'let d=""; process.stdin.on("data", c=>d+=c).on("end", ()=>{const a=JSON.parse(d); process.stdout.write(a.filename)})')
          # Emit a workspace-root-relative path so downstream steps (which run
          # from the repo root) can find the tarball.
          echo "tarball=packages/declarative-hex-worlds/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance (SLSA L3)
        # PRD G1. Cryptographically attests that this exact tarball was built
        # by this exact workflow run on GitHub-hosted infrastructure.
        # Consumers verify via `npm audit signatures` or `gh attestation verify`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Publish to npm with OIDC trusted publishing
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        # The first `declarative-hex-worlds@1.0.0` publish was issued
        # locally with an automation token (see PR body) so OIDC trusted
        # publishing could be configured on npmjs.com against this
        # workflow path + ref before the second publish.
        #
        # From v1.0.1 onward this workflow runs with NO `NODE_AUTH_TOKEN`
        # — npm sees `id-token: write` at the job's permissions and
        # exchanges the GitHub Actions OIDC token for a registry
        # credential automatically. `--provenance` attaches the SLSA
        # provenance statement to the publish; the `attest-build-provenance`
        # step above attaches the SLSA L3 build provenance to the tarball
        # bytes for `npm audit signatures` verification.
        #
        # Publish runs BEFORE the SBOM/attach steps: the SBOM is supplementary
        # provenance (PRD G2), so a cyclonedx hiccup must never block shipping
        # the actual bytes — the previous ordering let an `npm ls` failure in
        # the pnpm workspace skip the publish entirely.
        run: npm publish ${{ steps.pack.outputs.tarball }} --access public --provenance

      - name: Generate SBOM (CycloneDX)
        # PRD G2. CycloneDX 1.6 SBOM listing the full prod-dep tree of the
        # published package. Runs AFTER publish (supplementary). `--ignore-npm-errors`
        # because cyclonedx-npm shells out to `npm ls`, which reports ELSPROBLEMS
        # against the pnpm workspace's node_modules layout (invalid/missing peer
        # metadata) even though the tree is valid — those are npm-ls-vs-pnpm noise,
        # not real SBOM gaps.
        working-directory: packages/declarative-hex-worlds
        run: |
          pnpm exec cyclonedx-npm \
            --ignore-npm-errors \
            --output-format json \
            --output-file ../../sbom.cdx.json \
            --omit dev

      - name: Attach SBOM + tarball to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.pack.outputs.tarball }}
            sbom.cdx.json

      - name: Verify published package signatures
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        # Install the just-published version into a temp directory and verify
        # that the package's signatures are valid via npm audit signatures.
        # Failure here is a signal that provenance attestation was not attached
        # by the registry — the package is still published but this notifies us.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
        run: |
          # release-please tags as `<package>@<version>` (declarative-hex-worlds@1.2.2),
          # so on a release run github.ref_name is the FULL tag, not a bare version.
          # Interpolating it straight into `declarative-hex-worlds@$RELEASE_TAG`
          # produced `declarative-hex-worlds@declarative-hex-worlds@1.2.2`, which npm
          # rejects with EINVALIDTAGNAME.
          #
          # Gate the tag parsing on the EVENT, not on the shape of the ref: a
          # workflow_dispatch run sets ref_name to the selected branch/tag, and a
          # branch legitimately named `release@next` would otherwise have its suffix
          # parsed as a version — auditing a nonexistent or, worse, an unrelated
          # published version. Dispatch runs always read the checked-out package.
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${RELEASE_TAG##*@}"
          else
            VERSION=$(node -p "require('$GITHUB_WORKSPACE/packages/declarative-hex-worlds/package.json').version")
          fi
          echo "verifying signatures for declarative-hex-worlds@$VERSION"
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          npm init -y
          npm install "declarative-hex-worlds@$VERSION"
          npm audit signatures
          cd -
          rm -rf "$TMPDIR"
